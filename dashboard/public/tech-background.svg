<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice" width="1024" height="576">
  <defs>
    <!-- Field gradient: brighter blue on the left, deep navy on the right -->
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#1a51e0"/>
      <stop offset="42%" stop-color="#1342be"/>
      <stop offset="72%" stop-color="#0a1f6e"/>
      <stop offset="100%" stop-color="#03081f"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1342be" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#5b8cff" stroke-opacity="0.10" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cc0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9fd2ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7cc0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1024" height="576" fill="url(#field)"/>
  <rect width="1024" height="576" fill="url(#grid)"/>
  <rect width="1024" height="576" fill="url(#glow)"/>

  <!-- ===================== LEFT HUD CLUSTER (arcs open to the right) ===================== -->
  <g fill="none" stroke="#8fc4ff" filter="url(#soft)">
    <path d="M40 70 A 250 250 0 0 1 40 470" stroke-width="3" stroke-opacity="0.85"/>
    <path d="M70 95 A 215 215 0 0 1 70 445" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M150 150 A 140 140 0 0 1 150 390" stroke-width="6" stroke-opacity="0.9"/>
    <path d="M120 130 A 175 175 0 0 1 120 410" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 7"/>
    <path d="M95 112 A 200 200 0 0 1 95 430" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="2 9"/>
    <path d="M185 200 A 95 95 0 0 1 185 340" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 6"/>
    <path d="M205 250 A 42 42 0 0 1 205 318" stroke-width="2" stroke-opacity="0.7"/>
  </g>

  <!-- Left top bars -->
  <g fill="#9fd2ff">
    <rect x="140" y="78" width="46" height="9" rx="2" fill-opacity="0.9"/>
    <rect x="192" y="78" width="22" height="9" rx="2" fill-opacity="0.7"/>
    <rect x="140" y="92" width="30" height="6" rx="2" fill-opacity="0.55"/>
  </g>
  <!-- Left connector lines -->
  <g stroke="#7cc0ff" stroke-width="1.2" stroke-opacity="0.6" fill="none">
    <path d="M0 175 H 40 L 70 200"/>
    <path d="M0 235 H 22"/>
  </g>
  <!-- Left small squares -->
  <g fill="none" stroke="#9fd2ff" stroke-width="1.4" stroke-opacity="0.85">
    <rect x="196" y="392" width="9" height="9"/>
    <rect x="196" y="406" width="9" height="9"/>
    <rect x="183" y="406" width="9" height="9"/>
  </g>

  <!-- ===================== RIGHT HUD CLUSTER (arcs open to the left) ===================== -->
  <g fill="none" stroke="#8fc4ff" filter="url(#soft)">
    <path d="M980 40 A 300 300 0 0 0 980 520" stroke-width="3" stroke-opacity="0.85"/>
    <path d="M950 70 A 268 268 0 0 0 950 500" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M915 95 A 235 235 0 0 0 915 470" stroke-width="6" stroke-opacity="0.9"/>
    <path d="M885 120 A 205 205 0 0 0 885 445" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 8"/>
    <path d="M855 150 A 175 175 0 0 0 855 420" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="2 10"/>
    <path d="M820 230 A 95 95 0 0 0 820 360" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 7"/>
  </g>

  <!-- Right top circles -->
  <g fill="none" stroke="#9fd2ff" stroke-width="2">
    <circle cx="858" cy="140" r="34" stroke-opacity="0.8"/>
    <circle cx="858" cy="140" r="24" stroke-opacity="0.5"/>
    <circle cx="912" cy="140" r="20" stroke-opacity="0.7"/>
    <circle cx="958" cy="140" r="20" stroke-opacity="0.7"/>
  </g>
  <g fill="#bfe0ff">
    <circle cx="852" cy="105" r="3"/>
    <circle cx="862" cy="105" r="3" fill-opacity="0.7"/>
    <circle cx="872" cy="105" r="3" fill-opacity="0.5"/>
  </g>

  <!-- Right connector lines -->
  <g stroke="#7cc0ff" stroke-width="1.2" stroke-opacity="0.6" fill="none">
    <path d="M1024 215 H 980 L 950 245"/>
    <path d="M1024 300 H 960"/>
    <path d="M790 250 H 770 L 760 270 V 320"/>
  </g>

  <!-- Right glowing dots -->
  <g fill="#dff0ff">
    <circle cx="772" cy="240" r="2.6"/>
    <circle cx="788" cy="248" r="2.6" fill-opacity="0.8"/>
    <circle cx="772" cy="300" r="2.6" fill-opacity="0.7"/>
    <circle cx="612" cy="170" r="2.6"/>
  </g>

  <!-- Right info squares -->
  <g fill="#6fb2ff">
    <rect x="808" y="372" width="14" height="14" rx="2" fill-opacity="0.85"/>
    <rect x="826" y="372" width="14" height="14" rx="2" fill-opacity="0.6"/>
    <rect x="844" y="376" width="26" height="10" rx="2" fill-opacity="0.5"/>
    <rect x="808" y="390" width="62" height="6" rx="2" fill-opacity="0.4"/>
  </g>

  <!-- ===================== BOTTOM TECH STRIP ===================== -->
  <g stroke-width="2" fill="none">
    <line x1="0" y1="528" x2="1024" y2="528" stroke="url(#line)"/>
    <line x1="0" y1="540" x2="700" y2="540" stroke="#7cc0ff" stroke-opacity="0.45"/>
    <line x1="470" y1="552" x2="1024" y2="552" stroke="#7cc0ff" stroke-opacity="0.4"/>
  </g>
  <g fill="#7fe3ff">
    <circle cx="150" cy="544" r="4"/>
    <circle cx="172" cy="544" r="3" fill-opacity="0.8"/>
    <circle cx="210" cy="544" r="2.5" fill-opacity="0.6"/>
    <circle cx="300" cy="540" r="3.5"/>
    <circle cx="360" cy="548" r="3" fill-opacity="0.7"/>
  </g>

  <!-- Bottom-right angled panels -->
  <g fill="#3f8bff">
    <path d="M724 556 l40 0 l-8 18 l-40 0 z" fill-opacity="0.85"/>
    <path d="M770 556 l60 0 l-8 18 l-60 0 z" fill-opacity="0.6"/>
    <path d="M724 548 l110 0 l-4 6 l-110 0 z" fill-opacity="0.4"/>
  </g>
</svg>
